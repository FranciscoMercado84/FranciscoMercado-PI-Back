openapi: 3.0.3
info:
  title: Panadería Polvillo - API REST
  description: |
    API REST para la tienda online y panel de gestión de **Panadería Polvillo**.
    
    ## 🔐 Autenticación
    
    Esta API usa **JWT Bearer Token** para proteger los endpoints.
    
    ### Pasos para autenticarse:
    1. Usa `POST /v1/auth/register` para crear una cuenta o usa las credenciales de prueba
    2. Usa `POST /v1/auth/login` con tus credenciales
    3. Copia el **access_token** de la respuesta
    4. Haz clic en el botón **"Authorize"** 🔓 arriba
    5. Pega el token (sin "Bearer ", solo el token)
    6. Haz clic en **"Authorize"** y luego **"Close"**
    
    ### Credenciales de prueba:
    
    | Rol | Email | Password |
    |-----|-------|----------|
    | Admin | admin@panaderia.com | admin123 |
    | Cliente | cliente@test.com | test123 |
    
    ## 📁 Categorías disponibles
    - Despensa y básicos
    - Conservas y Enlatados
    - Aceites, Vinagres y Salsas
    - Bebidas y Bodega
    - Charcutería
    - Dulces
    - Panadería
    
  version: "1.0.0"
  contact:
    name: Francisco Mercado
    email: admin@panaderia.com

servers:
  - url: http://localhost:3001/v1
    description: Servidor de desarrollo local
  - url: https://franciscomercado-pi-back.onrender.com/v1
    description: Servidor de producción (Render)

tags:
  - name: Health
    description: Endpoints de estado del sistema
  - name: Auth
    description: Autenticación y gestión de usuarios
  - name: Productos
    description: Catálogo de productos
  - name: Inventario
    description: Gestión de stock (solo admin)
  - name: Carrito
    description: Carrito de compras
  - name: Pedidos
    description: Gestión de pedidos

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT obtenido del endpoint POST /v1/auth/login

  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
          example: ERROR_CODE
        message:
          type: string
          example: Descripción del error

    ValidationError:
      type: object
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Error de validación
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

    Usuario:
      type: object
      properties:
        id:
          type: string
          example: "507f1f77bcf86cd799439011"
        nombre:
          type: string
          example: Juan García
        email:
          type: string
          format: email
          example: juan@email.com
        role:
          type: string
          enum: [customer, admin]
          example: customer

    AuthResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            access_token:
              type: string
              example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
            user:
              $ref: '#/components/schemas/Usuario'

    Producto:
      type: object
      properties:
        _id:
          type: string
          example: "507f1f77bcf86cd799439011"
        nombre:
          type: string
          example: Barra Campesina
        descripcion:
          type: string
          example: Pan tradicional de corteza crujiente
        precio:
          type: number
          format: float
          example: 1.20
        imagen_url:
          type: string
          example: https://res.cloudinary.com/...
        categoria:
          type: string
          enum: 
            - Despensa y básicos
            - Conservas y Enlatados
            - Aceites, Vinagres y Salsas
            - Bebidas y Bodega
            - Charcutería
            - Dulces
            - Panadería
        stock:
          type: integer
          example: 50
        stock_minimo:
          type: integer
          example: 20
        stock_bajo:
          type: boolean
          example: false
        estado_inventario:
          type: string
          enum: [disponible, bajo, agotado]
        disponible:
          type: boolean
          example: true
        peso:
          type: integer
          description: Peso en gramos
          example: 250
        ingredientes:
          type: string
        alergenos:
          type: array
          items:
            type: string
          example: ["gluten"]
        destacado:
          type: boolean
          example: true

    ProductoInput:
      type: object
      required:
        - nombre
        - precio
        - categoria
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 200
        descripcion:
          type: string
          maxLength: 1000
        precio:
          type: number
          minimum: 0
        categoria:
          type: string
          enum: 
            - Despensa y básicos
            - Conservas y Enlatados
            - Aceites, Vinagres y Salsas
            - Bebidas y Bodega
            - Charcutería
            - Dulces
            - Panadería
        stock:
          type: integer
          minimum: 0
          default: 0
        stock_minimo:
          type: integer
          minimum: 0
          default: 10
        peso:
          type: integer
        ingredientes:
          type: string
        alergenos:
          type: array
          items:
            type: string
        destacado:
          type: boolean

    CarritoItem:
      type: object
      properties:
        _id:
          type: string
        producto:
          $ref: '#/components/schemas/Producto'
        cantidad:
          type: integer
          minimum: 1
        precio_unitario:
          type: number

    Carrito:
      type: object
      properties:
        _id:
          type: string
        usuario:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/CarritoItem'
        total:
          type: number

    PedidoItem:
      type: object
      properties:
        producto:
          type: string
        nombre_producto:
          type: string
        cantidad:
          type: integer
        precio_unitario:
          type: number
        subtotal:
          type: number

    Pedido:
      type: object
      properties:
        _id:
          type: string
        numero_pedido:
          type: string
          example: "ORD-1707234567890-ABC123"
        usuario:
          type: object
          properties:
            _id:
              type: string
            nombre:
              type: string
            email:
              type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/PedidoItem'
        nombre_cliente:
          type: string
        telefono:
          type: string
        total:
          type: number
        estado:
          type: string
          enum: [Pendiente, En preparación, Listo, Entregado, Cancelado]
        hora_recogida:
          type: string
          format: date-time
        notas:
          type: string
        createdAt:
          type: string
          format: date-time

    PedidoInput:
      type: object
      required:
        - nombre_cliente
        - telefono
        - hora_recogida
      properties:
        nombre_cliente:
          type: string
        telefono:
          type: string
          pattern: '^[0-9]{9}$'
        hora_recogida:
          type: string
          format: date-time
        notas:
          type: string
          maxLength: 500

    Meta:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        pages:
          type: integer

  responses:
    UnauthorizedError:
      description: Token no proporcionado o inválido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: UNAUTHORIZED
            message: Token de autenticación inválido o expirado
    
    ForbiddenError:
      description: Sin permisos suficientes (requiere admin)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: FORBIDDEN
            message: Acceso denegado. Solo administradores.
    
    NotFoundError:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: NOT_FOUND
            message: Recurso no encontrado
    
    ValidationError:
      description: Error de validación
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'

paths:
  # ==================== HEALTH ====================
  /health:
    get:
      tags: [Health]
      summary: Estado del servidor
      description: Verifica si la API está funcionando correctamente
      operationId: healthCheck
      responses:
        '200':
          description: Servidor operativo
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: OK
                  timestamp:
                    type: string
                    format: date-time
                  service:
                    type: string
                    example: Panadería Polvillo API
                  mongodb:
                    type: string
                    example: connected

  # ==================== AUTH ====================
  /auth/register:
    post:
      tags: [Auth]
      summary: Registrar nuevo usuario
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, email, password]
              properties:
                nombre:
                  type: string
                  example: Juan García
                email:
                  type: string
                  format: email
                  example: juan@email.com
                password:
                  type: string
                  minLength: 6
                  example: password123
                telefono:
                  type: string
                  pattern: '^[0-9]{9}$'
                  example: "666111222"
      responses:
        '201':
          description: Usuario registrado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Email ya registrado o error de validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                emailExists:
                  value:
                    code: EMAIL_EXISTS
                    message: El email ya está registrado

  /auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesión
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: admin@panaderia.com
                password:
                  type: string
                  example: admin123
      responses:
        '200':
          description: Login exitoso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_CREDENTIALS
                message: Email o contraseña incorrectos

  /auth/profile:
    get:
      tags: [Auth]
      summary: Obtener perfil del usuario autenticado
      operationId: getProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Perfil del usuario
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  # ==================== PRODUCTOS ====================
  /productos:
    get:
      tags: [Productos]
      summary: Listar productos
      operationId: getProductos
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: categoria
          in: query
          schema:
            type: string
          description: Filtrar por categoría
        - name: q
          in: query
          schema:
            type: string
          description: Búsqueda por texto
      responses:
        '200':
          description: Lista de productos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Producto'
                  meta:
                    $ref: '#/components/schemas/Meta'

    post:
      tags: [Productos]
      summary: Crear producto (admin)
      operationId: createProducto
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductoInput'
            example:
              nombre: Croissant de Mantequilla
              descripcion: Croissant artesanal con mantequilla francesa
              precio: 1.50
              categoria: Panadería
              stock: 30
              stock_minimo: 10
              peso: 80
              ingredientes: Harina, mantequilla, azúcar, levadura
              alergenos: ["gluten", "lácteos"]
      responses:
        '201':
          description: Producto creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Producto'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /productos/{id}:
    get:
      tags: [Productos]
      summary: Obtener producto por ID
      operationId: getProductoById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Producto encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Producto'
        '404':
          $ref: '#/components/responses/NotFoundError'

    put:
      tags: [Productos]
      summary: Actualizar producto (admin)
      operationId: updateProducto
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductoInput'
      responses:
        '200':
          description: Producto actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Producto'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    delete:
      tags: [Productos]
      summary: Eliminar producto (admin)
      description: Marca el producto como no disponible (soft delete)
      operationId: deleteProducto
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Producto eliminado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: Producto eliminado correctamente
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /productos/{id}/imagen:
    post:
      tags: [Productos]
      summary: Subir imagen de producto (admin)
      operationId: uploadProductImage
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                imagen:
                  type: string
                  format: binary
      responses:
        '200':
          description: Imagen subida
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      imagen_url:
                        type: string
                      imagen_public_id:
                        type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    delete:
      tags: [Productos]
      summary: Eliminar imagen de producto (admin)
      operationId: deleteProductImage
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Imagen eliminada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: Imagen eliminada correctamente
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /productos/{id}/stock:
    put:
      tags: [Inventario]
      summary: Actualizar stock de producto (admin)
      operationId: updateStock
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operacion, cantidad]
              properties:
                operacion:
                  type: string
                  enum: [agregar, reducir, establecer]
                  description: Tipo de operación
                cantidad:
                  type: integer
                  minimum: 0
            examples:
              agregar:
                summary: Agregar stock
                value:
                  operacion: agregar
                  cantidad: 20
              reducir:
                summary: Reducir stock
                value:
                  operacion: reducir
                  cantidad: 5
              establecer:
                summary: Establecer stock
                value:
                  operacion: establecer
                  cantidad: 100
      responses:
        '200':
          description: Stock actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      stock:
                        type: integer
                      stock_bajo:
                        type: boolean
                      estado_inventario:
                        type: string
                        enum: [disponible, bajo, agotado]
                      disponible:
                        type: boolean
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /productos/inventario/bajo-stock:
    get:
      tags: [Inventario]
      summary: Productos con stock bajo (admin)
      description: Lista productos donde stock <= stock_minimo
      operationId: getProductosBajoStock
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de productos con stock bajo
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Producto'
                  meta:
                    type: object
                    properties:
                      total:
                        type: integer
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /productos/inventario/agotados:
    get:
      tags: [Inventario]
      summary: Productos agotados (admin)
      description: Lista productos con stock = 0
      operationId: getProductosAgotados
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de productos agotados
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Producto'
                  meta:
                    type: object
                    properties:
                      total:
                        type: integer
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  # ==================== CARRITO ====================
  /carrito:
    get:
      tags: [Carrito]
      summary: Obtener carrito del usuario
      operationId: getCarrito
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Carrito del usuario
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Carrito'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

    delete:
      tags: [Carrito]
      summary: Vaciar carrito
      operationId: clearCarrito
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Carrito vaciado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Carrito'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /carrito/items:
    post:
      tags: [Carrito]
      summary: Agregar producto al carrito
      operationId: addCartItem
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productoId]
              properties:
                productoId:
                  type: string
                  description: ID del producto
                producto_id:
                  type: string
                  description: Alternativa (snake_case)
                cantidad:
                  type: integer
                  minimum: 1
                  default: 1
            example:
              productoId: "507f1f77bcf86cd799439011"
              cantidad: 2
      responses:
        '201':
          description: Producto agregado al carrito
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Carrito'
        '400':
          description: Producto no disponible o stock insuficiente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                noDisponible:
                  value:
                    code: PRODUCTO_NOT_AVAILABLE
                    message: Producto no disponible
                stockInsuficiente:
                  value:
                    code: INSUFFICIENT_STOCK
                    message: "Stock insuficiente. Disponible: 5"
                    stock_disponible: 5
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Producto no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /carrito/items/{id}:
    put:
      tags: [Carrito]
      summary: Actualizar cantidad de item
      operationId: updateCartItem
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: ID del item del carrito (no del producto)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cantidad]
              properties:
                cantidad:
                  type: integer
                  minimum: 0
                  description: Si es 0, elimina el item
            example:
              cantidad: 3
      responses:
        '200':
          description: Item actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Carrito'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Carrito o item no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [Carrito]
      summary: Eliminar item del carrito
      operationId: removeCartItem
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: ID del item del carrito
      responses:
        '200':
          description: Item eliminado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Carrito'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  # ==================== PEDIDOS ====================
  /pedidos:
    get:
      tags: [Pedidos]
      summary: Obtener mis pedidos
      operationId: getMisPedidos
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Lista de pedidos del usuario
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Pedido'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

    post:
      tags: [Pedidos]
      summary: Crear pedido desde el carrito
      operationId: createPedido
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PedidoInput'
            example:
              nombre_cliente: Juan García
              telefono: "666111222"
              hora_recogida: "2026-02-10T10:30:00.000Z"
              notas: Sin gluten si es posible
      responses:
        '201':
          description: Pedido creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Pedido'
        '400':
          description: Carrito vacío
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: CARRITO_EMPTY
                message: El carrito está vacío
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /pedidos/{id}:
    get:
      tags: [Pedidos]
      summary: Obtener pedido por ID
      operationId: getPedidoById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Pedido encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Pedido'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: No tienes permiso para ver este pedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /pedidos/{id}/estado:
    put:
      tags: [Pedidos]
      summary: Actualizar estado del pedido (admin)
      description: |
        Transiciones permitidas:
        - Pendiente → En preparación, Cancelado
        - En preparación → Listo, Cancelado
        - Listo → Entregado
        - Entregado → (ninguna)
        - Cancelado → (ninguna)
      operationId: updateEstadoPedido
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado]
              properties:
                estado:
                  type: string
                  enum: [Pendiente, En preparación, Listo, Entregado, Cancelado]
            example:
              estado: En preparación
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Pedido'
        '400':
          description: Transición de estado no permitida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /pedidos/admin/all:
    get:
      tags: [Pedidos]
      summary: Todos los pedidos (admin)
      operationId: getAllPedidos
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: estado
          in: query
          schema:
            type: string
            enum: [Pendiente, En preparación, Listo, Entregado, Cancelado]
          description: Filtrar por estado
      responses:
        '200':
          description: Lista de todos los pedidos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Pedido'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
