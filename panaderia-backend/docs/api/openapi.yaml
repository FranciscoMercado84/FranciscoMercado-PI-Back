openapi: 3.0.3
info:
  title: Panadería - API
  description: API v1 para la tienda online y panel de gestión de "Panadería El Sabor Artesano".
  version: "1.0.0"

servers:
  - url: https://api.tu-panaderia.local/v1
    description: Local / staging server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # Error wrapper
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: INVALID_INPUT
        message:
          type: string
          example: "El campo 'nombre' es obligatorio"
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                example: "precio"
              issue:
                type: string
                example: "must be greater than 0"

    # Pagination meta
    PageMeta:
      type: object
      properties:
        total:
          type: integer
          example: 125
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        pages:
          type: integer
          example: 7

    # Category
    Category:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Pan"
        description:
          type: string
          example: "Panes artesanales"
    CategoryCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string

    # Product
    Product:
      type: object
      properties:
        id:
          type: integer
          example: 10
        name:
          type: string
          example: "Baguette"
        description:
          type: string
        price:
          type: number
          format: double
          example: 1.50
        stock:
          type: integer
          example: 30
        category_id:
          type: integer
          example: 1
        image_url:
          type: string
          format: uri
    ProductCreate:
      type: object
      required: [name, price, category_id]
      properties:
        name:
          type: string
        description:
          type: string
        price:
          type: number
          format: double
        stock:
          type: integer
        category_id:
          type: integer
        image_base64:
          type: string
          description: "Base64 string (optional) for initial implementation; prefer multipart/form-data in production"

    # User / Cliente
    Client:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
    ClientCreate:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        password:
          type: string
          format: password

    AuthRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      properties:
        access_token:
          type: string
          example: "eyJhbGciOi..."
        token_type:
          type: string
          example: "bearer"
        expires_in:
          type: integer
          example: 3600
        user:
          $ref: '#/components/schemas/Client'

    # Cart
    Cart:
      type: object
      properties:
        id:
          type: integer
        client_id:
          type: integer
        created_at:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
    CartItem:
      type: object
      properties:
        product_id:
          type: integer
        name:
          type: string
        price:
          type: number
        quantity:
          type: integer
        subtotal:
          type: number

    CartAddRequest:
      type: object
      required: [product_id, quantity]
      properties:
        product_id:
          type: integer
        quantity:
          type: integer
    CartUpdateRequest:
      type: object
      required: [product_id, quantity]
      properties:
        product_id:
          type: integer
        quantity:
          type: integer

    # Order
    Order:
      type: object
      properties:
        id:
          type: integer
        client_id:
          type: integer
        created_at:
          type: string
          format: date-time
        total:
          type: number
        status:
          type: string
          enum: [Pendiente, En preparación, Listo, Recogido, Cancelado]
        pickup_time:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
    OrderCreateRequest:
      type: object
      required: [client_name, client_phone, pickup_time, items]
      properties:
        client_name:
          type: string
        client_phone:
          type: string
        pickup_time:
          type: string
          format: date-time
        notes:
          type: string
        items:
          type: array
          items:
            type: object
            required: [product_id, quantity]
            properties:
              product_id:
                type: integer
              quantity:
                type: integer
    OrderItem:
      type: object
      properties:
        product_id:
          type: integer
        name:
          type: string
        quantity:
          type: integer
        price:
          type: number
        subtotal:
          type: number

    # Contact
    ContactRequest:
      type: object
      required: [name, email, message]
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        message:
          type: string

  parameters:
    page:
      name: page
      in: query
      description: Page number (1-based)
      schema:
        type: integer
        default: 1
    limit:
      name: limit
      in: query
      description: Items per page
      schema:
        type: integer
        default: 20
        maximum: 100
    q:
      name: q
      in: query
      description: Search query
      schema:
        type: string

security:
  - bearerAuth: []

paths:
  /v1/categories:
    get:
      summary: List categories (paginated)
      tags: [categories]
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Paginated list of categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create category (admin)
      tags: [categories]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/schemas/Error'

  /v1/products:
    get:
      summary: List products (filterable, paginated)
      tags: [products]
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/q'
        - name: category_id
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Products list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
    post:
      summary: Create product (admin)
      tags: [products]
      security:
        - bearerAuth: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                price:
                  type: number
                stock:
                  type: integer
                category_id:
                  type: integer
                image:
                  type: string
                  format: binary
        required: true
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/products/{product_id}:
    get:
      summary: Get product detail
      tags: [products]
      parameters:
        - name: product_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Product data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Update product (admin)
      tags: [products]
      security:
        - bearerAuth: []
      parameters:
        - name: product_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreate'
      responses:
        '200':
          description: Updated product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/schemas/Error'
    delete:
      summary: Delete product (admin)
      tags: [products]
      security:
        - bearerAuth: []
      parameters:
        - name: product_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/schemas/Error'

  /v1/auth/register:
    post:
      summary: Register new client
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientCreate'
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/schemas/Error'

  /v1/auth/login:
    post:
      summary: Login (client/admin)
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: Auth successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/cart:
    get:
      summary: Get current cart for authenticated client
      tags: [cart]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Cart data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '401':
          $ref: '#/components/schemas/Error'
    post:
      summary: Add item to cart
      tags: [cart]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartAddRequest'
      responses:
        '200':
          description: Item added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '400':
          $ref: '#/components/schemas/Error'
    put:
      summary: Update item quantity in cart
      tags: [cart]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartUpdateRequest'
      responses:
        '200':
          description: Cart updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
    delete:
      summary: Clear cart
      tags: [cart]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Cart cleared

  /v1/orders:
    get:
      summary: List orders (admin or client own orders)
      tags: [orders]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
        - name: status
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Orders list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
    post:
      summary: Create order (checkout) - allows guest checkout
      tags: [orders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreateRequest'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/schemas/Error'

  /v1/orders/{order_id}:
    get:
      summary: Get order detail
      tags: [orders]
      security:
        - bearerAuth: []
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Order detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/schemas/Error'
    put:
      summary: Update order status (admin)
      tags: [orders]
      security:
        - bearerAuth: []
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [Pendiente, "En preparación", Listo, Recogido, Cancelado]
      responses:
        '200':
          description: Order updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/schemas/Error'

  /v1/contact:
    post:
      summary: Send contact message
      tags: [contact]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactRequest'
      responses:
        '201':
          description: Message received
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
        '400':
          $ref: '#/components/schemas/Error'

  # Admin endpoints (explicit)
  /v1/admin/products:
    get:
      summary: Admin - list products
      tags: [admin, products]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Admin products list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
    # POST uses /v1/products (shared)

  /v1/admin/orders:
    get:
      summary: Admin - list orders
      tags: [admin, orders]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Orders list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
                  meta:
                    $ref: '#/components/schemas/PageMeta'

  /v1/admin/clients:
    get:
      summary: Admin - list clients
      tags: [admin, clients]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Clients list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Client'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
