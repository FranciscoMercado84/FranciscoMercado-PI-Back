sonar.projectKey=Panaderia
sonar.projectName=Panaderia
sonar.sources=src/
sonar.tests=tests/
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Playwright JUnit report (E2E) — imported as test execution report
sonar.testExecutionReportPaths=e2e-results/sonar-test-execution.xml
sonar.exclusions=dist/**,src/index.js,src/server.js,src/loaders/menuHandler.js,src/routes/authRoutes.js,src/services/authService.js,src/middlewares/requestLogger.js
sonar.coverage.exclusions=**/*.test.*,tests/**,src/index.js,src/server.js,src/loaders/middlewareHandler.js,src/routes/authRoutes.js,src/services/authService.js,src/middlewares/requestLogger.js
sonar.test.inclusions=tests/**/*.test.js,tests/e2e/**/*.spec.js
sonar.host.url=http://localhost:9000
# Pass the token at run time with -Dsonar.token=... or via SONAR_TOKEN